## 任何一条错误日志只要调用栈触到带补丁的位点, 就把该位点上是谁打的补丁接在对应帧后面
# Setting type: Boolean
# Default value: false
PatchTrace.Enabled = false

## 是否也给 Warning 附注解(默认只处理 Error/Fatal)
# Setting type: Boolean
# Default value: false
PatchTrace.IncludeWarning = false

## 栈上没有命中任何补丁时也附一份裁剪过的栈
# Setting type: Boolean
# Default value: false
PatchTrace.AlwaysAttach = false

## 一条注解里最多展开几帧
# Setting type: Int32
# Default value: 25
PatchTrace.MaxFrames = 25

## 同一条错误最多附几次明细
# Setting type: Int32
# Default value: 3
PatchTrace.DetailPerError = 3

## 最多为多少条不同的错误附明细
# Setting type: Int32
# Default value: 200
PatchTrace.MaxErrors = 200

## 注解日志的总行数上限
# Setting type: Int32
# Default value: 2000
PatchTrace.MaxLines = 2000

## 是否为其它 mod 的 GetBulletType / TypeMgr.IsAirZombie 补丁安装重入断路器
# Setting type: Boolean
# Default value: false
ReentrancyGuard.Enabled = false

