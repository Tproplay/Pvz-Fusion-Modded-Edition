[开场选择]

## 进入主菜单后弹出一次「大帝子弹上限」选择面板（星辰紫金的开幕动画 + 7 档数字任选）。选择结果直接写入 [性能] 大帝子弹场上上限，立刻生效、无需重启。★ 面板只在「别人没有全屏面板、时间没有被冻住」的真空窗里出现，绝不与其它模组的开幕动画叠在一起；面板里勾了「下次不再询问」会自动把这一项写成 false。
# Setting type: Boolean
# Default value: true
显示子弹上限选择界面 = false

## 面板上摆哪几个数字（英文逗号分隔，会自动去重、升序、并夹在 16~4000 之间）。默认 100,200,300,500,800,1500,4000。想给玩家更细的档位就在这里加；全部写坏时回退默认表。
# Setting type: String
# Default value: 100,200,300,500,800,1500,4000
上限可选值 = 100,200,300,500,800,1500,4000

## 开场面板整体大小（1 = 旧版，默认 1.45 = 放大 45%）。面板里所有尺寸都按 1920×1080 的参考分辨率书写，放大靠等比缩小参考分辨率实现 ⇒ 字号、按钮、星场、光晕一起放大，不会只有卡片变大而字不变。范围 1~1.7（再大卡片两侧的植物立绘会被屏幕边缘切掉）。
# Setting type: Single
# Default value: 1.45
面板缩放 = 1.45

[性能]

## 场上「大帝系」子弹（249 极帝星星 / 49 究极星星，即本插件两株植物与究极星辰大帝同款的子弹）太多时会卡。开启后，超过上限时新子弹不再生成，它的攻击力改为叠加到本植物下一枚放出的子弹上（伤害不丢、场上子弹数封顶）。
# Setting type: Boolean
# Default value: true
大帝子弹合并 = true

## 场上大帝系子弹的数量上限（两种子弹合计）。达到它就开始合并。太小 = 子弹很少但单体伤害极高；太大 = 起不到减卡作用。默认 500，范围 16~4000。
# Setting type: Int32
# Default value: 500
大帝子弹场上上限 = 500

## 同一株植物被连续压制这么久后强制放出一发（带着累积的全部伤害），避免它在场上被别的来源填满时一直排不到出弹机会。范围 0.2~10。
# Setting type: Single
# Default value: 1.2
大帝子弹合并最长压制（秒） = 1.2

